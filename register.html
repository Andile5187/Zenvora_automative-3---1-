<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a Zenvora Automative account.">
    <meta name="robots" content="noindex">
    <title>Register | Zenvora Automative</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
</head>
<body>

<header class="site-header">
<nav class="nav-container">
    <div class="logo"></div>
    <img src="images/Image.jpg" class="nav-logo" alt="Zenvora Automative logo">
    <div class="nav-links">
<a href="Home.html">Home|</a>
<a href="About Us.html">About Us|</a>
<a href="Services.html">Services|</a>
<a href="Showroom.html">Showroom|</a>
<a href="enquiry.html">Enquiry|</a>
<a href="Contact Us.html">Contact Us|</a>
</div>
</nav>
</header>

<main>
<h1 align="center">Create an Account</h1>
<hr>
<form id="register-form" class="auth-form" novalidate>
<div class="field">
<label for="reg-name">Full name:</label>
<input type="text" id="reg-name" name="name" autocomplete="name">
<span class="error-message"></span>
</div>
<div class="field">
<label for="reg-email">Email Address:</label>
<input type="email" id="reg-email" name="email" autocomplete="email">
<span class="error-message"></span>
</div>
<div class="field">
<label for="reg-password">Password:</label>
<input type="password" id="reg-password" name="password" autocomplete="new-password">
<span class="error-message"></span>
</div>
<div class="field">
<label for="reg-confirm">Confirm password:</label>
<input type="password" id="reg-confirm" name="confirm" autocomplete="new-password">
<span class="error-message"></span>
</div>
<input type="submit" value="Register">
<p id="register-status" class="form-status" role="status"></p>
<p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
</form>
</main>

<footer class="site-footer">&copy;ST10483250</footer>
</body>
</html>
