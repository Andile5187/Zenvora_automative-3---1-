<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse the Zenvora Automative showroom: new and pre-owned vehicles in Randburg, Johannesburg, with live availability and pricing.">
    <meta name="keywords" content="car showroom Randburg, used cars for sale Johannesburg, Zenvora Automative vehicles">
    <title>Showroom | Zenvora Automative</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
</head>
<body>

<header class="site-header">
<nav class="nav-container">
    <div class="logo"></div>
    <img src="images/Image.jpg" class="nav-logo" alt="Zenvora Automative logo">
    <div class="nav-links">
<a href="Home.html">Home|</a>
<a href="About Us.html">About Us|</a>
<a href="Services.html">Services|</a>
<a href="Showroom.html">Showroom|</a>
<a href="enquiry.html">Enquiry|</a>
<a href="Contact Us.html">Contact Us|</a>
</div>
</nav>
</header>

<main>
<h1 align="center">Showroom</h1>
<hr>

<div class="showroom-controls">
<input type="search" id="car-search" placeholder="Search by vehicle name...">
<select id="car-status-filter">
<option value="all">All availability</option>
<option value="In Stock">In Stock</option>
<option value="Reserved">Reserved</option>
<option value="Sold">Sold</option>
</select>
<span id="car-result-count"></span>
</div>

<div class="gallery" id="car-gallery">
<!-- Vehicle cards are generated by js/script.js from the CARS data array -->
</div>

<div class="gallery-video-wrap">
<video width="50%" height="550" controls>
<source src="images/video one.mp4" type="video/mp4">
</video>
<video width="800" height="550" controls>
<source src="images/video two.mp4" type="video/mp4">
</video>
<video width="800" height="450" controls>
<source src="images/video three.mp4" type="video/mp4">
</video>
</div>

</main>

<!-- Lightbox for the vehicle gallery -->
<div class="lightbox" id="lightbox">
<button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
<button class="lightbox-prev" id="lightbox-prev" aria-label="Previous image">&#10094;</button>
<div class="lightbox-content">
<img id="lightbox-img" src="" alt="">
<p id="lightbox-caption"></p>
</div>
<button class="lightbox-next" id="lightbox-next" aria-label="Next image">&#10095;</button>
</div>

<footer class="site-footer">&copy;ST10483250</footer>
<script src="js/script.js" defer></script>
</body>
</html>
